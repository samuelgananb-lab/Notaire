<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <title>Iniciar Sesión | Notaire</title>
    <!-- Incluimos la fuente Outfit de Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/auth.css?v=20261102-password-eye2">
</head>
<body class="auth-page">
    <!-- Efecto visual de fondo -->
    <div class="background-shapes" aria-hidden="true">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>
    
    <canvas id="windParticles" aria-hidden="true"></canvas>
    
    <main id="authApp" class="container auth-container" data-auth-screen="login" data-auth-script="assets/js/login.js?v=20261102-password-eye">
        <section id="authPanel" class="login-card auth-panel">
            <div class="card-header">
                <div class="brand-logo-container">
                    <img src="assets/img/notaire-auth-logo.svg" class="main-logo" alt="Notaire">
                </div>
                <h1>Bienvenido a Notaire</h1>
                <p>Ingresa tus credenciales para acceder a tu panel.</p>
            </div>
            
            <form id="loginForm" class="login-form">
                <div class="input-group">
                    <label for="email">Correo Electrónico</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="email" id="email" name="email" placeholder="ejemplo@notaire.com" required>
                    </div>
                </div>
                
                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="password" name="password" placeholder="••••••••" required>
                        <button type="button" class="toggle-password password-toggle" data-password-target="password" aria-label="Mostrar contraseña" aria-pressed="false">
                            <i class="fas fa-eye-slash" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox"> <span>Recordarme</span>
                    </label>
                    <a href="olvide-password.html" class="forgot-link">¿Olvidaste tu contraseña?</a>
                </div>
                
                <button type="submit" class="submit-btn" id="loginBtn">
                    <span>Iniciar Sesión</span>
                    <div class="loader" id="loader"></div>
                </button>
                <p class="login-error" id="loginError" role="alert" aria-live="polite" hidden></p>
            </form>
            
            <div class="card-footer">
                <p>¿No tienes una cuenta? <a href="register.html" id="btnIrARegistro" class="signup-link">Regístrate gratis</a></p>
            </div>
        </section>
    </main>

    <script src="../assets/js/password-toggle.js?v=20261102-password-eye2"></script>
    <script src="assets/js/login.js?v=20261102-password-eye" data-auth-screen-script></script>
    <script src="assets/js/auth-app.js?v=20261102-auth-password-eye2"></script>
</body>
</html>
