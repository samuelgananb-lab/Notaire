<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <title>Iniciar Sesión | Notaire</title>
    <!-- Incluimos la fuente Outfit de Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/login.css">
</head>
<body>
    <!-- Efecto visual de fondo -->
    <div class="background-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>
    
    <canvas id="windParticles"></canvas>
    
    <main class="container">
        <div class="login-card">
            <div class="card-header">
                <div class="brand-logo-container">
                    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" class="main-logo">
                        <polygon points="50,5 95,25 95,75 50,95 5,75 5,25" fill="#A225F5" />
                        <polygon points="50,10 90,30 90,70 50,90 10,70 10,30" fill="#8C00FF" />
                        <text x="50" y="70" font-family="'Georgia', serif" font-size="55" font-weight="bold" fill="white" text-anchor="middle">N</text>
                    </svg>
                </div>
                <h1>Bienvenido a Notaire</h1>
                <p>Ingresa tus credenciales para acceder a tu panel.</p>
            </div>
            
            <form id="loginForm" class="login-form">
                <div class="input-group">
                    <label for="email">Correo Electrónico</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="email" id="email" name="email" placeholder="ejemplo@notaire.com" required>
                    </div>
                </div>
                
                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="password" name="password" placeholder="••••••••" required>
                        <i class="fas fa-eye toggle-password" id="togglePassword"></i>
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox"> <span>Recordarme</span>
                    </label>
                    <a href="olvide-password.html" class="forgot-link">¿Olvidaste tu contraseña?</a>
                </div>
                
                <button type="submit" class="submit-btn" id="loginBtn">
                    <span>Iniciar Sesión</span>
                    <div class="loader" id="loader"></div>
                </button>
            </form>
            
            <div class="card-footer">
                <p style="color: #aaa; text-align: center; margin-top: 15px;">¿No tienes una cuenta? <a href="register.html" id="btnIrARegistro" class="signup-link" style="color: #a855f7; text-decoration: none; font-weight: bold;">Regístrate gratis</a></p>
            </div>
        </div>
    </main>

    <script src="assets/js/login.js"></script>
</body>
</html>
