<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña | Notaire</title>
    <!-- Incluimos la fuente Outfit de Google Fonts para un aspecto premium -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Archivo de estilos principal para esta vista -->
    <link rel="stylesheet" href="assets/css/olvide-password.css">
</head>
<body>
    <!-- Efecto visual de fondo con gradientes de los colores solicitados -->
    <div class="background-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>
    
    <!-- Canvas para efecto de viento espacial/dinámico -->
    <canvas id="windParticles"></canvas>
    
    <main class="container">
        <!-- Tarjeta principal de Glassmorphism -->
        <div class="recovery-card">
            <div class="card-header">
                <div class="icon-wrapper">
                    <!-- Icono de candado / recuperación -->
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"></path>
                    </svg>
                </div>
                <h1>¿Olvidaste tu contraseña?</h1>
                <p>No te preocupes, ingresa tu correo electrónico y te enviaremos las instrucciones para recuperarla.</p>
            </div>
            
            <form id="recoveryForm" class="recovery-form">
                <div class="input-group">
                    <label for="email">Correo Electrónico</label>
                    <div class="input-wrapper">
                        <!-- Icono de correo electrónico -->
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="input-icon">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                            <polyline points="22,6 12,13 2,6"></polyline>
                        </svg>
                        <input type="email" id="email" name="email" placeholder="tu@correo.com" required autocomplete="email">
                    </div>
                </div>
                
                <button type="submit" class="submit-btn" id="submitBtn">
                    <span>Enviar instrucciones</span>
                    <div class="loader" id="loader"></div>
                </button>
            </form>
            
            <div class="card-footer">
                <p>¿Recuerdas tu contraseña? <a href="#" class="back-link" onclick="history.back()">Volver al inicio de sesión</a></p>
            </div>
        </div>
    </main>

    <!-- Script de interacción y simulación del envío -->
    <script src="assets/js/olvide-password.js"></script>
</body>
</html>
