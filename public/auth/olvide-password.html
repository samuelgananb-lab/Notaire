<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <title>Recuperar Contraseña | Notaire</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/olvide-password.css?v=20261026-recovery6">
</head>
<body>
    <div class="background-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>
    
    <canvas id="windParticles"></canvas>
    
    <main class="container">
        <div class="recovery-card">
            <div class="card-header">
                <div class="brand-logo-container">
                    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" class="main-logo" aria-label="Notaire">
                        <polygon points="50,5 95,25 95,75 50,95 5,75 5,25" fill="#A225F5" />
                        <polygon points="50,10 90,30 90,70 50,90 10,70 10,30" fill="#8C00FF" />
                        <text x="50" y="70" font-family="'Georgia', serif" font-size="55" font-weight="bold" fill="white" text-anchor="middle">N</text>
                    </svg>
                </div>
                <h1>¿Olvidaste tu contraseña?</h1>
                <p>No te preocupes, ingresa tu correo electrónico y te enviaremos las instrucciones para recuperarla.</p>
            </div>
            
            <form id="recoveryForm" class="recovery-form">
                <div class="input-group">
                    <label for="email">Correo Electrónico</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope input-icon" aria-hidden="true"></i>
                        <input type="email" id="email" name="email" placeholder="tu@correo.com" required autocomplete="email">
                    </div>
                </div>
                
                <button type="submit" class="submit-btn" id="submitBtn">
                    <span>Enviar instrucciones</span>
                    <div class="loader" id="loader"></div>
                </button>
                <p class="form-status" id="formStatus" role="status" aria-live="polite" hidden></p>
            </form>

            <section class="recovery-result" id="recoveryResult" aria-live="polite" hidden>
                <div class="result-icon" aria-hidden="true"><i class="fas fa-envelope-circle-check"></i></div>
                <h2>Revisa tu correo</h2>
                <p>Si el correo está registrado, recibirás instrucciones para restablecer tu contraseña.</p>
            </section>
            
            <div class="card-footer">
                <p>¿Recuerdas tu contraseña? <a href="login.html" class="back-link">Volver al inicio de sesión</a></p>
            </div>
        </div>
    </main>

    <script src="assets/js/olvide-password.js?v=20261026-recovery6"></script>
</body>
</html>
