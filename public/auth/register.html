<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <title>Crear cuenta - Notaire</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./assets/css/login.css?v=20261026-mobile2">
    <!-- CSS -->
    <link rel="stylesheet" href="./assets/css/register.css?v=20261102-auth-match2">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="background-shapes" aria-hidden="true">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>
    <canvas id="windParticles" aria-hidden="true"></canvas>

    <div class="register-container">
        <div class="brand-logo-container">
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" class="main-logo" aria-label="Notaire">
                <polygon points="50,5 95,25 95,75 50,95 5,75 5,25" fill="#A225F5" />
                <polygon points="50,10 90,30 90,70 50,90 10,70 10,30" fill="#8C00FF" />
                <text x="50" y="70" font-family="'Georgia', serif" font-size="55" font-weight="bold" fill="white" text-anchor="middle">N</text>
            </svg>
        </div>
        <h1 class="register-heading">Crear cuenta</h1>
        <p class="register-subtitle">Únete a Notaire y gestiona tus finanzas de forma inteligente.</p>

        <form id="registerForm" class="register-form" novalidate>
            <!-- User Name -->
            <div class="input-group">
                <label for="username">Nombre completo</label>
                <div class="input-shell"><div class="input-icon"><i class="fa-solid fa-user"></i></div>
                <input type="text" id="username" class="input-field" placeholder="Ej: Juan Pérez" autocomplete="name" required></div>
            </div>

            <!-- Phone Number -->
            <div class="input-group">
                <label for="phone">Teléfono</label>
                <div class="input-shell"><div class="input-icon"><i class="fa-solid fa-phone"></i></div>
                <input type="tel" id="phone" class="input-field" placeholder="Ej: 300 123 4567" autocomplete="tel" required></div>
            </div>

            <!-- Email Address -->
            <div class="input-group">
                <label for="email">Correo electrónico</label>
                <div class="input-shell"><div class="input-icon"><i class="fa-regular fa-envelope"></i></div>
                <input type="email" id="email" class="input-field" placeholder="tu@correo.com" autocomplete="email" required></div>
            </div>

            <!-- Password -->
            <div class="input-group">
                <label for="password">Contraseña</label>
                <div class="input-shell"><div class="input-icon"><i class="fa-solid fa-lock"></i></div>
                <input type="password" id="password" class="input-field" placeholder="Mínimo 8 caracteres" autocomplete="new-password" required>
                <div class="password-toggle" onclick="togglePassword('password', this)">
                    <i class="fa-solid fa-eye"></i>
                </div></div>
                <div class="password-meter" id="passwordMeter"><span></span><span></span><span></span><span></span></div>
                <small class="password-hint">Usa mayúsculas, minúsculas, números y símbolos.</small>
            </div>

            <!-- Confirm Password -->
            <div class="input-group">
                <label for="confirmPassword">Confirmar contraseña</label>
                <div class="input-shell"><div class="input-icon"><i class="fa-solid fa-lock"></i></div>
                <input type="password" id="confirmPassword" class="input-field" placeholder="Repite tu contraseña" autocomplete="new-password" required>
                <div class="password-toggle" onclick="togglePassword('confirmPassword', this)">
                    <i class="fa-solid fa-eye"></i>
                </div></div>
            </div>

            <p id="registerMessage" class="form-message" role="alert" aria-live="polite"></p>
            <button type="submit" class="btn-create" id="registerButton"><i class="fa-solid fa-plus"></i><span>Crear cuenta</span></button>

            <p class="register-footer">¿Ya tienes una cuenta? <a href="login.html">Inicia sesión</a></p>
        </form>
    </div>

    <!-- Script -->
    <script src="./assets/js/register.js"></script>
</body>

</html>
