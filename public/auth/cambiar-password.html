<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <title>Cambiar contraseña | Notaire</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/auth.css?v=20261101-auth-glow1">
</head>
<body class="auth-page">
    <div class="background-shapes" aria-hidden="true">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>
    <canvas id="windParticles" aria-hidden="true"></canvas>
    <main id="authApp" class="container auth-container" data-auth-screen="change-password" data-auth-script="assets/js/cambiar-password.js?v=20261101-auth-glow1">
        <section id="authPanel" class="recovery-card auth-panel">
            <div class="card-header">
                <div class="brand-logo-container">
                    <img src="assets/img/notaire-auth-logo.svg" class="main-logo" alt="Notaire">
                </div>
                <h1>Cambiar contraseña</h1>
                <p>Define una nueva contraseña segura para tu cuenta.</p>
            </div>
            <form id="changePasswordForm" class="recovery-form">
                <div class="input-group"><label for="password">Nueva contraseña</label><div class="input-wrapper"><i class="fas fa-lock input-icon" aria-hidden="true"></i><input type="password" id="password" minlength="8" required autocomplete="new-password"></div></div>
                <div class="input-group"><label for="confirmPassword">Confirmar contraseña</label><div class="input-wrapper"><i class="fas fa-lock input-icon" aria-hidden="true"></i><input type="password" id="confirmPassword" minlength="8" required autocomplete="new-password"></div></div>
                <button type="submit" class="submit-btn" id="changePasswordBtn"><span>Actualizar contraseña</span><div class="loader" aria-hidden="true"></div></button>
            </form>
            <p class="form-status" id="formStatus" role="status" aria-live="polite" hidden></p>
            <div class="card-footer"><p><a href="login.html">Volver al inicio de sesión</a></p></div>
        </section>
    </main>
    <script src="assets/js/cambiar-password.js?v=20261101-auth-glow1" data-auth-screen-script></script>
    <script src="assets/js/auth-app.js?v=20261101-auth-glow1"></script>
</body>
</html>
