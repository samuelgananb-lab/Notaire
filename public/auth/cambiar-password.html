<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <title>Cambiar contraseña | Notaire</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/olvide-password.css?v=20261026-recovery6">
</head>
<body>
    <div class="background-shapes" aria-hidden="true">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>
    <canvas id="windParticles" aria-hidden="true"></canvas>
    <main class="container">
        <div class="recovery-card">
            <div class="card-header">
                <div class="brand-logo-container">
                    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" class="main-logo" aria-label="Notaire">
                        <polygon points="50,5 95,25 95,75 50,95 5,75 5,25" fill="#A225F5" />
                        <polygon points="50,10 90,30 90,70 50,90 10,70 10,30" fill="#8C00FF" />
                        <text x="50" y="70" font-family="'Georgia', serif" font-size="55" font-weight="bold" fill="white" text-anchor="middle">N</text>
                    </svg>
                </div>
                <h1>Cambiar contraseña</h1>
                <p>Define una nueva contraseña segura para tu cuenta.</p>
            </div>
            <form id="changePasswordForm" class="recovery-form">
                <div class="input-group"><label for="password">Nueva contraseña</label><div class="input-wrapper"><i class="fas fa-lock input-icon" aria-hidden="true"></i><input type="password" id="password" minlength="8" required autocomplete="new-password"></div></div>
                <div class="input-group"><label for="confirmPassword">Confirmar contraseña</label><div class="input-wrapper"><i class="fas fa-lock input-icon" aria-hidden="true"></i><input type="password" id="confirmPassword" minlength="8" required autocomplete="new-password"></div></div>
                <button type="submit" class="submit-btn" id="changePasswordBtn"><span>Actualizar contraseña</span></button>
            </form>
            <p class="form-status" id="formStatus" role="status" aria-live="polite" hidden></p>
            <div class="card-footer"><p><a href="login.html">Volver al inicio de sesión</a></p></div>
        </div>
    </main>
    <script src="assets/js/olvide-password.js?v=20261026-recovery6"></script>
    <script src="assets/js/cambiar-password.js?v=20261026-recovery6"></script>
</body>
</html>
