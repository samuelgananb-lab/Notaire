<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <title>Cambiar contraseña | Notaire</title>
    <link rel="stylesheet" href="assets/css/olvide-password.css">
</head>
<body>
    <main class="container">
        <div class="recovery-card">
            <div class="card-header">
                <div class="icon-wrapper"><i class="fa-solid fa-lock"></i></div>
                <h1>Cambiar contraseña</h1>
                <p>Define una nueva contraseña segura para tu cuenta.</p>
            </div>
            <form id="changePasswordForm" class="recovery-form">
                <div class="input-group"><label for="password">Nueva contraseña</label><div class="input-wrapper"><input type="password" id="password" minlength="8" required autocomplete="new-password"></div></div>
                <div class="input-group"><label for="confirmPassword">Confirmar contraseña</label><div class="input-wrapper"><input type="password" id="confirmPassword" minlength="8" required autocomplete="new-password"></div></div>
                <button type="submit" class="submit-btn" id="changePasswordBtn"><span>Actualizar contraseña</span></button>
            </form>
            <div class="card-footer"><p><a href="login.html">Volver al inicio de sesión</a></p></div>
        </div>
    </main>
    <script src="assets/js/cambiar-password.js"></script>
</body>
</html>
